name: SDK release candidate
on:
  push:
    branches: ['integration/**']
    paths-ignore: ['PHASE6_RESULTS.md', 'RELEASE_DECISIONS.md', 'tools/phase6_report.py', 'tools/github_phase6.py', 'tools/inspect_jitpack.py', 'tools/verify_published_legacy.py', 'phase6_historical_integrity.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-rc-${{ github.ref }}
  cancel-in-progress: false
env:
  FTE_PHASE5_EVIDENCE: results/phase6/github/${{ github.run_id }}/${{ github.run_attempt }}
  FTE_MAVEN_LOCAL: ${{ github.workspace }}/.evidence/phase6/maven-local
  LIBGL_ALWAYS_SOFTWARE: '1'
  ALSOFT_DRIVERS: 'null'
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - id: targets
        run: python3 -c 'import json,os; c=json.load(open("targets.json")); assert len(c["targets"])==13; open(os.environ["GITHUB_OUTPUT"],"a").write("targets="+json.dumps([t["minecraft"] for t in c["targets"]])+"\n")'
  target:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix: {mc: '${{ fromJSON(needs.matrix.outputs.targets) }}'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pinned JDKs, Python and Xvfb
        run: sh ci/phase5/bootstrap-ci.sh
      - name: Compile, staging, independent consumers, production and network regression
        run: sh ci/phase6/job.sh '${{ matrix.mc }}'
      - name: Retain successful and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: target-${{ matrix.mc }}-${{ github.run_attempt }}
          path: |
            ${{ env.FTE_PHASE5_EVIDENCE }}/
            build/staging-maven/
            consumers/mc${{ matrix.mc }}/build/libs/
            consumers/mc${{ matrix.mc }}/build/phase3-client/hs_err_pid*.log
            consumers/mc${{ matrix.mc }}/build/phase3-client/crash-reports/
          if-no-files-found: error
          retention-days: 30
  all-targets:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sh ci/phase5/bootstrap-ci.sh
      - name: One Gradle build, all targets, no target_versions filter
        run: |
          mkdir -p "$FTE_PHASE5_EVIDENCE/aggregate"
          ./gradlew --no-daemon --console=plain --max-workers=2 javaToolchains sdkBuild sdkStage -Pstaging_repository="$PWD/build/aggregate-maven" 2>&1 | tee "$FTE_PHASE5_EVIDENCE/aggregate/gradle.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-${{ github.run_attempt }}
          path: |
            ${{ env.FTE_PHASE5_EVIDENCE }}/
            build/aggregate-maven/
          if-no-files-found: error
  loader-controls:
    needs: [matrix, target]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.21.4', wrong: '26.3'}
          - {mc: '26.3', wrong: '1.21.4'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: target-*-${{ github.run_attempt }}
          merge-multiple: true
      - run: sh ci/phase5/bootstrap-ci.sh
      - run: python3 phase6_loader_controls.py --target '${{ matrix.mc }}' --wrong-target '${{ matrix.wrong }}'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loader-controls-${{ matrix.mc }}-${{ github.run_attempt }}
          path: ${{ env.FTE_PHASE5_EVIDENCE }}/${{ matrix.mc }}/loader-controls/
          if-no-files-found: error
  required:
    name: SDK required matrix
    if: always()
    needs: [matrix, target, loader-controls, all-targets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: target-*-${{ github.run_attempt }}
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aggregate-${{ github.run_attempt }}
      - name: Fail if any mandatory job failed or was skipped
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          TARGET_RESULT: ${{ needs.target.result }}
          LOADER_RESULT: ${{ needs.loader-controls.result }}
          AGGREGATE_RESULT: ${{ needs.all-targets.result }}
        run: test "$MATRIX_RESULT" = success && test "$TARGET_RESULT" = success && test "$LOADER_RESULT" = success && test "$AGGREGATE_RESULT" = success
      - run: python3 phase6_provenance.py --summary && python3 phase6_aggregate_check.py && python3 phase5_verify.py --stage summary
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-summary-${{ github.run_attempt }}
          path: ${{ env.FTE_PHASE5_EVIDENCE }}/
          if-no-files-found: error
